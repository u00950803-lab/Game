.m2,.m3{display:none}
.tok[class*=" e-"] .m1{display:none}
.tok:is(.e-joy,.e-dance,.e-dizzy) .m2{display:inline}
.tok:is(.e-sad,.e-cry,.e-cold,.e-mad) .m3{display:inline}
.aL,.aR{transform-origin:20px 23px}

.tok:not(.walk):is(.e-joy,.e-dance) .aR{animation:waveR .25s ease-in-out infinite alternate}

.tok:not(.walk):is(.e-dizzy,.e-mad) .aR{transform:rotate(-60deg)}

var PL,S,cur,over=true,resume=null,paused=false,snd=true,arm={t:false,p:false},toks=[],AC,gen=0,mode="bot";
var $=function(id){return document.getElementById(id)};
var W=$("w"),sc=$("scene"),dice=$("dice"),go=$("go"),tT=$("tT"),tP=$("tP");
function zone(i){return i<30?0:i<60?1:i<80?2:3}
function P(i){var row=Math.floor(i/10),c=i%10;if(row%2)c=9-c;return[(c-4.5)*72,-row*110]}
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function say(t){$("log").textContent=t}
async function sleep(ms){var g=gen;await new Promise(function(r){setTimeout(r,ms)});while(paused)await new Promise(function(r){setTimeout(r,150)});if(g!==gen)throw 0}
function beep(f,d){if(!snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function vib(){try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}}
(function build(){
  for(var i=0;i<=LAST;i++){
    var p=P(i),d=document.createElement("div");
    d.className="cell c-"+MAP[i];d.style.left=(p[0]-30)+"px";d.style.top=(p[1]-30)+"px";d.style.borderColor=ZB[zone(i)];
    d.innerHTML='<div class="ico">'+ICON[MAP[i]]+'</div>';W.appendChild(d);
    if(i<LAST){var q=P(i+1),l=document.createElement("div");l.className="link";l.style.left=((p[0]+q[0])/2)+"px";l.style.top=((p[1]+q[1])/2)+"px";W.appendChild(l)}
  }
  COL.forEach(function(c,k){
    var t=document.createElement("div");t.className="tok";
    t.innerHTML='<div class="sh"></div><div class="st" style="color:'+c+'"><svg viewBox="0 0 40 60" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"><g class="bd"><circle cx="20" cy="10" r="7.5" fill="currentColor"/><circle class="eye" cx="17.2" cy="9" r="1.1" fill="#0b0a22" stroke="none"/><circle class="eye" cx="22.8" cy="9" r="1.1" fill="#0b0a22" stroke="none"/><path class="m1" d="M16.5 12.2Q20 15 23.5 12.2" stroke="#0b0a22" stroke-width="1.3"/><ellipse class="m2" cx="20" cy="13" rx="2.2" ry="2.6" fill="#0b0a22" stroke="none"/><path class="m3" d="M16.5 14.4Q20 11.4 23.5 14.4" stroke="#0b0a22" stroke-width="1.3"/><line x1="20" y1="18" x2="20" y2="36"/><line class="aL" x1="20" y1="23" x2="8" y2="32"/><line class="aR" x1="20" y1="23" x2="32" y2="32"/><line class="lL" x1="20" y1="36" x2="12" y2="57"/><line class="lR" x1="20" y1="36" x2="28" y2="57"/></g></svg><div class="bub"></div></div>';
    W.appendChild(t);toks.push(t);$("m"+k).style.background=c;
  });
})();
function cam(i){
  var p=P(i),z=zone(i);
  W.style.transform="rotateX(58deg) translate("+(-p[0])+"px,"+(-p[1])+"px)";
  sc.style.setProperty("--py",(-p[1]*.12)+"px");sc.style.setProperty("--px",(-p[0]*.12)+"px");
  sc.style.setProperty("--zc",ZC[z]);
}
function place(k){var p=P(S[k].pos);toks[k].style.left=(p[0]+OFF[k])+"px";toks[k].style.top=p[1]+"px";if(k===cur)cam(S[k].pos)}
function hud(){
  var box=$("pls");box.innerHTML="";
  PL.forEach(function(p,k){
    var s=S[k],c=document.createElement("div");c.className="pl glass"+(k===cur&&!over?" act":"");c.style.setProperty("--c",COL[k]);
    c.innerHTML='<b><span class="dot" style="background:'+COL[k]+'"></span>'+p.n+(p.bot?" 🤖":"")+'</b><span>'+(s.sh?"🛡️ ":"")+(s.sk?"🧊 ":"")+"⚡"+s.tu+" 🎯"+s.bo+" · "+s.pos+"/"+LAST+'</span>';
    box.appendChild(c);$("m"+k).style.left=(s.pos/LAST*100)+"%";
  });
  if(S[cur]){tT.textContent="⚡ Turbo ×"+S[cur].tu;tP.textContent="🎯 +2 ×"+S[cur].bo;tT.classList.toggle("on",arm.t);tP.classList.toggle("on",arm.p)}
}
async function walk(k,n){
  var d=n<0?-1:1,s=S[k];toks[k].classList.add("walk");
  for(var j=0;j<Math.abs(n);j++){
    var nx=s.pos+d;if(nx<0||nx>LAST)break;
    s.pos=nx;place(k);beep(480+nx*4,.05);hud();await sleep(270);
    if(s.pos===LAST)break;
  }
  toks[k].classList.remove("walk");
}
async function jump(k,i){toks[k].style.transitionDuration=".9s";S[k].pos=i;place(k);hud();beep(300,.3);await sleep(1000);toks[k].style.transitionDuration=""}
async function bad(k,msg,fn,e){
  var s=S[k];vib();
  if(s.sh){s.sh=false;say("🛡️ "+PL[k].n+"ning qalqoni himoya qildi!");await sleep(900)}
  else{emo(k,e||"dizzy",e==="cold"?"🥶":"😵",2200);say(PL[k].n+": "+msg);await sleep(700);await fn()}
}
async function swap(k){var a=S[k].pos,b=S[1-k].pos;say("🔄 "+PL[k].n+" raqib bilan joy almashdi!");emo(k,"spin","🔄",1300);emo(1-k,"spin","🔄",1300);await sleep(500);await Promise.all([jump(k,b),jump(1-k,a)])}
async function land(k){
  var p=S[k],t=MAP[p.pos],n=PL[k].n;
  if(t==="s")await swap(k);
  else if(t==="u"){p.tu++;say("⚡ "+n+" turbo oldi!");emo(k,"joy","⚡",1500);beep(800,.2)}
  else if(t==="q"){p.sh=true;say("🛡️ "+n+" qalqon oldi!");emo(k,"joy","🛡️",1500);beep(700,.2)}
  else if(t==="i")await bad(k,"🧊 muzga tushdi, keyingi navbati o‘tadi",function(){p.sk=true},"cold");
  else if(t==="k"){var b=rnd(5,8);await bad(k,"🕳️ qora tuynuk "+b+" katak ortga tortdi!",function(){return walk(k,-b)})}
  else if(t==="x"){
    var m=rnd(0,5);
    if(m===0){say("🎁 Sirli quti: +5 katak oldinga!");await sleep(600);await walk(k,5)}
    else if(m===1)await bad(k,"🎁 sirli qutidan 4 katak ortga!",function(){return walk(k,-4)});
    else if(m===2){p.sh=true;say("🎁 Qalqon topdi!")}
    else if(m===3){p.tu++;p.bo++;say("🎁 Turbo va 🎯 oldi!")}
    else if(m===4)await bad(k,"🎁 muzlab qoldi!",function(){p.sk=true},"cold");
    else await swap(k);
  }
  hud();await sleep(500);
}
async function roll(p){
  var a=rnd(1,10),b=a,note="";
  if(arm.t&&p.tu>0){p.tu--;b=rnd(1,10);note=" (⚡ "+a+" va "+b+")"}
  var r=Math.max(a,b);
  if(arm.p&&p.bo>0){p.bo--;r+=2;note+=" 🎯+2"}
  arm.t=arm.p=false;
  dice.classList.add("roll");
  for(var i=0;i<9;i++){dice.textContent=rnd(1,10);beep(300+i*40,.04);await sleep(70)}
  dice.classList.remove("roll");dice.textContent=r;return[r,note];
}
function setBtns(e){go.disabled=!e;tT.disabled=tP.disabled=!e}
go.onclick=function(){if(resume){var f=resume;resume=null;setBtns(false);f()}};
tT.onclick=function(){if(S[cur].tu>0){arm.t=!arm.t;hud()}};
tP.onclick=function(){if(S[cur].bo>0){arm.p=!arm.p;hud()}};
$("tPa").onclick=function(){paused=!paused;this.textContent=paused?"▶":"⏸"};
$("tS").onclick=function(){snd=!snd;this.textContent=snd?"🔊":"🔇"};
function confetti(){for(var i=0;i<50;i++){var c=document.createElement("b");c.className="cf";c.style.cssText="left:"+rnd(5,95)+"%;background:hsl("+rnd(0,360)+",90%,60%);--dx:"+rnd(-60,60)+"px;animation-delay:"+(Math.random()*.5)+"s";sc.appendChild(c);setTimeout(c.remove.bind(c),2800)}}
function win(k){
  over=true;hud();confetti();emo(k,"dance","🏆",0);emo(1-k,"cry","😭",0);[600,760,920,1200].forEach(function(f,i){setTimeout(function(){beep(f,.2)},i*160)});
  $("ot").textContent="🏆 "+PL[k].n+(PL[k].bot?" yutdi!":" yutdi! 🎉");
  showOver("w");ST.g++;if(k===0)ST.w++;saveST();stats();
}
async function play(){
  while(!over){
    var p=S[cur];hud();cam(p.pos);
    if(p.sk){p.sk=false;say("🧊 "+PL[cur].n+" muzlab qoldi, navbati o‘tdi");await sleep(1300);cur=1-cur;continue}
    if(PL[cur].bot){say(PL[cur].n+" kubik tashlayapti…");await sleep(1000);arm.t=p.tu>0&&Math.random()<.3;arm.p=p.bo>0&&Math.random()<.25}
    else{say(PL[cur].n+", sizning navbatingiz!");setBtns(true);await new Promise(function(r){resume=r})}
    var x=await roll(p);say(PL[cur].n+": "+x[0]+" tushdi"+x[1]);if(x[0]>=8)emo(cur,"joy","🥳",2000);else if(x[0]<=2)emo(cur,"sad","😢",2000);await sleep(450);
    await walk(cur,x[0]);
    if(p.pos>=LAST){win(cur);return}
    await land(cur);
    if(S[cur].pos>=LAST){win(cur);return}
    cur=1-cur;
  }
}
function start(){
  gen++;var b=mode==="bot";
  PL=[{n:$("n1").value.trim()||"Player"},{n:b?"Bot":($("n2").value.trim()||"Player 2"),bot:b}];
  S=[0,1].map(function(){return{pos:0,sh:false,sk:false,tu:1,bo:2}});
  cur=0;over=false;resume=null;arm.t=arm.p=false;setBtns(false);dice.textContent="?";
  $("over").classList.add("off");
  toks.forEach(function(t,k){emo(k,"")});[0,1].forEach(place);hud();play().catch(function(){});
}
function showOver(w){$("over").classList.remove("off");$("ow").hidden=w!=="w";$("om").hidden=w==="w"}
function openMode(){gen++;over=true;resume=null;paused=false;$("tPa").textContent="⏸";setBtns(false);cam(0);showOver("m")}
function show(id){$("menu").hidden=id!=="menu";$("game").hidden=id!=="game"}
document.querySelectorAll(".seg .tb").forEach(function(b){b.onclick=function(){mode=b.dataset.m;document.querySelectorAll(".seg .tb").forEach(function(x){x.classList.toggle("on",x===b)});var n=$("n2");n.disabled=mode==="bot";n.value=mode==="bot"?"Bot":"Player 2"}});
$("g1").onclick=$("np").onclick=function(){show("game");openMode()};
$("bk").onclick=$("mn").onclick=function(){gen++;over=true;resume=null;show("menu")};
$("rs").onclick=$("ag").onclick=openMode;
function who(n){$("hn").textContent=n;$("pn").textContent=n}
var EM=["joy","sad","dizzy","cold","spin","dance","cry","mad"];
function emo(k,e,ic,ms){var t=toks[k];EM.forEach(function(x){t.classList.remove("e-"+x)});clearTimeout(t._t);if(e){t.classList.add("e-"+e);if(ms)t._t=setTimeout(function(){t.classList.remove("e-"+e)},ms)}var b=t.querySelector(".bub");if(ic){b.textContent=ic;b.classList.remove("on");void b.offsetWidth;b.classList.add("on")}}
document.querySelectorAll("#emos button").forEach(function(b){b.onclick=function(){if(over||!S)return;emo(mode==="bot"?0:cur,b.dataset.e,b.textContent,2200)}});
function tab(p){$("mhome").hidden=p!=="h";$("mprof").hidden=p!=="p";$("nh").classList.toggle("on",p==="h");$("npr").classList.toggle("on",p==="p")}
$("nh").onclick=function(){tab("h")};$("npr").onclick=function(){tab("p")};
$("st").onclick=function(){start();who(PL[0].n);try{localStorage.setItem("np_n",PL[0].n)}catch(e){}};
stats();try{var sn=localStorage.getItem("np_n");if(sn){$("n1").value=sn;who(sn)}}catch(e){}
setTimeout(function(){var s=$("splash");s.classList.add("off");setTimeout(function(){s.remove()},700)},1800);
</script>
</body>
</html>
